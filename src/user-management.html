<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management - Supply Chain Lite</title>
    <link rel="icon" type="image/svg+xml" href="scc.svg" />
  </head>
  <body class="min-vh-100 d-flex flex-column">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-2">
      <div class="container-fluid align-items-center">
        <div class="d-flex align-items-center">
          <img src="/summence_bw.png" alt="" width="36" height="36" />
          <h1 class="fs-5 fw-bold text-dark ms-3 mb-0">SupplyChainLite</h1>
        </div>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse align-items-center ms-lg-5" id="navbarNav">
          <ul class="nav nav-tabs mb-0" id="managementTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button
                class="nav-link active"
                id="users-tab"
                data-bs-toggle="tab"
                data-bs-target="#users-pane"
                type="button"
                role="tab"
                aria-controls="users-pane"
                aria-selected="true"
              >
                Users
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="roles-tab"
                data-bs-toggle="tab"
                data-bs-target="#roles-pane"
                type="button"
                role="tab"
                aria-controls="roles-pane"
                aria-selected="false"
              >
                Roles
              </button>
            </li>
          </ul>
        </div>
        <div class="navbar-actions d-flex align-items-center">
          <a
            class="nav-link text-dark d-flex align-items-center p-0"
            href="home-page.html"
            aria-label="Home"
          >
            <span
              class="bg-dark text-white rounded-circle d-flex align-items-center justify-content-center me-2"
              style="width: 40px; height: 40px"
            >
              <i class="fa-solid fa-home" aria-label="Home" aria-hidden="true"></i>
            </span>
          </a>
          <div class="dropdown">
            <a
              class="nav-link text-dark d-flex align-items-center p-0"
              href="#"
              role="button"
              id="userDropdown"
              aria-label="User menu"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <span
                id="displayAvatar"
                class="bg-dark text-white rounded-circle d-flex align-items-center justify-content-center me-2"
                style="width: 40px; height: 40px"
              >
                ?
              </span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
              <li><a class="dropdown-item" href="#" id="logoutBtn">Logout</a></li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <main class="container-fluid flex-fill d-flex py-4 user-management-page">
      <div class="tab-content d-flex flex-column flex-fill" id="managementTabContent">
        <div
          id="users-pane"
          class="tab-pane fade show active row flex-fill mx-0"
          role="tabpanel"
          aria-labelledby="users-tab"
        >
          <aside class="col-md-3 mb-3 mb-md-0" id="userListContainer">
            <div class="card h-100">
              <div class="card-body" id="userListBody" style="overflow-y: auto">
                <h2 class="card-title h4 text-center mb-3">Users</h2>
                <div class="input-group mb-3">
                  <input
                    type="search"
                    class="form-control"
                    id="userSearchInput"
                    placeholder="Search users..."
                    aria-label="Search users"
                  />
                  <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                </div>
                <div class="list-group" id="userList"></div>
              </div>
              <div class="card-footer text-left py-2 px-2" id="paginationButtons"></div>
            </div>
          </aside>
          <div class="col-md-9 mb-md-0 mb-3" id="userDetailsContainer">
            <div class="card h-100">
              <div class="card-body" id="userDetailsBody">
                <div class="d-flex gap-3 h-100">
                  <div class="tab-content user-detail-content flex-fill" id="userDetailTabsContent">
                    <section
                      class="tab-pane fade show active pt-0 mb-0 me-5"
                      id="user-details-pane"
                      role="tabpanel"
                      aria-labelledby="user-details-tab"
                    >
                      <form id="userDetailsForm">
                        <div class="user-detail-grid">
                          <label class="form-label" for="selectedUserEmail">Email</label>
                          <input
                            class="form-control"
                            id="selectedUserEmail"
                            type="email"
                            required
                          />
                          <label class="form-label" for="selectedUserRole">Permission Level</label>
                          <select class="form-select" id="selectedUserRole" required></select>
                          <label class="form-label" for="selectedFirstName">Display Name</label>
                          <input class="form-control" id="selectedFirstName" type="text" required />
                          <span class="form-label">Status</span>
                          <div class="form-check form-switch user-switch">
                            <input
                              class="form-check-input"
                              type="checkbox"
                              role="switch"
                              id="selectedUserStatus"
                            />
                            <label class="form-check-label" for="selectedUserStatus">
                              Inactive
                            </label>
                          </div>
                          <label class="form-label" for="accessExpiry">Access Expiry</label>
                          <input class="form-control" id="accessExpiry" type="date" required />
                        </div>
                      </form>
                    </section>
                    <section
                      class="tab-pane fade pt-0 mb-0 me-5"
                      id="user-modules-pane"
                      role="tabpanel"
                      aria-labelledby="user-modules-tab2"
                    >
                      <div class="user-detail-grid">
                        <span class="form-label">Templates</span>
                        <div class="template-list border rounded p-3" id="userTemplates"></div>
                        <label class="form-label" for="maxConcurrentRuns">
                          Maximum Concurrent Runs
                        </label>
                        <input
                          class="form-control"
                          id="maxConcurrentRuns"
                          form="userDetailsForm"
                          type="number"
                          min="1"
                          step="1"
                          required
                        />
                      </div>
                    </section>
                  </div>
                  <ul
                    class="nav flex-column user-detail-tabs"
                    role="tablist"
                    aria-orientation="vertical"
                  >
                    <li class="nav-item" role="presentation">
                      <button
                        class="nav-link active"
                        id="user-details-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#user-details-pane"
                        type="button"
                        role="tab"
                        aria-controls="user-details-pane"
                        aria-selected="true"
                      >
                        User Details
                      </button>
                    </li>
                    <li class="nav-item" role="presentation">
                      <button
                        class="nav-link"
                        id="user-modules-tab2"
                        data-bs-toggle="tab"
                        data-bs-target="#user-modules-pane"
                        type="button"
                        role="tab"
                        aria-controls="user-modules-pane"
                        aria-selected="false"
                      >
                        Templates
                      </button>
                    </li>
                  </ul>
                </div>
              </div>
              <div class="card-footer d-flex justify-content-end py-2 px-2" id="useractionButtons">
                <div class="btn-group w-30" role="group" aria-label="User action buttons">
                  <button type="button" class="btn btn-outline-secondary" id="addUserButton">
                    <i class="fa-solid fa-plus me-1"></i>
                    Add New
                  </button>
                  <button type="button" class="btn btn-dark" id="userPreviousButton" hidden>
                    <i class="fa-solid fa-arrow-left me-1"></i>
                    Previous
                  </button>
                  <button type="button" class="btn btn-dark" id="userNextButton">
                    Next
                    <i class="fa-solid fa-arrow-right ms-1"></i>
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    id="saveAsUserButton"
                    hidden
                  >
                    <i class="fa-solid fa-copy me-1"></i>
                    Save As
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    id="saveUserButton"
                    hidden
                  >
                    <i class="fa-solid fa-check me-1"></i>
                    Save
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div
          id="roles-pane"
          class="tab-pane fade row flex-fill mx-0"
          role="tabpanel"
          aria-labelledby="roles-tab"
        >
          <aside class="col-md-3 mb-3 mb-md-0" id="roleListContainer">
            <div class="card h-100">
              <div class="card-body" id="roleListBody" style="overflow-y: auto">
                <h2 class="card-title h4 text-center mb-3">Roles</h2>
                <div class="list-group" id="roleList"></div>
              </div>
            </div>
          </aside>
          <div class="col-md-9 mb-md-0 mb-3" id="roleDetailsContainer">
            <div class="card h-100">
              <div class="card-body" id="roleDetailsBody">
                <div class="d-flex gap-3 h-100">
                  <div class="tab-content user-detail-content flex-fill" id="roleDetailTabsContent">
                    <section
                      class="tab-pane fade show active pt-0 mb-0 me-5"
                      id="role-details-pane"
                      role="tabpanel"
                      aria-labelledby="role-details-tab"
                    >
                      <form id="roleDetailsForm">
                        <div class="user-detail-grid">
                          <label class="form-label" for="selectedRoleName">Role Name</label>
                          <input class="form-control" id="selectedRoleName" type="text" required />
                          <label class="form-label" for="selectedRoleDescription">
                            Description
                          </label>
                          <textarea
                            class="form-control"
                            id="selectedRoleDescription"
                            rows="4"
                            required
                          ></textarea>
                          <span class="form-label">Can Add New Model</span>
                          <div class="form-check form-switch user-switch">
                            <input
                              class="form-check-input"
                              type="checkbox"
                              role="switch"
                              id="adminRoleFlag"
                            />
                            <label class="form-check-label" for="adminRoleFlag">No</label>
                          </div>
                          <label class="form-label" for="selectedRoleHomePage">Home Page</label>
                          <select class="form-select" id="selectedRoleHomePage" required></select>
                        </div>
                      </form>
                    </section>
                    <section
                      class="tab-pane fade pt-0 mb-0 me-5"
                      id="role-permissions-pane"
                      role="tabpanel"
                      aria-labelledby="role-permissions-tab"
                    >
                      <div class="template-list border rounded p-3" id="roleModules"></div>
                    </section>
                    <section
                      class="tab-pane fade pt-0 mb-0 me-5"
                      id="role-users-pane"
                      role="tabpanel"
                      aria-labelledby="role-users-tab"
                    >
                      <div class="list-group" id="roleAssignedUsers"></div>
                    </section>
                  </div>
                  <ul
                    class="nav flex-column user-detail-tabs"
                    role="tablist"
                    aria-orientation="vertical"
                  >
                    <li class="nav-item" role="presentation">
                      <button
                        class="nav-link active"
                        id="role-details-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#role-details-pane"
                        type="button"
                        role="tab"
                        aria-controls="role-details-pane"
                        aria-selected="true"
                      >
                        Role Details
                      </button>
                    </li>
                    <li class="nav-item" role="presentation">
                      <button
                        class="nav-link"
                        id="role-permissions-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#role-permissions-pane"
                        type="button"
                        role="tab"
                        aria-controls="role-permissions-pane"
                        aria-selected="false"
                      >
                        Modules
                      </button>
                    </li>
                    <li class="nav-item" role="presentation">
                      <button
                        class="nav-link"
                        id="role-users-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#role-users-pane"
                        type="button"
                        role="tab"
                        aria-controls="role-users-pane"
                        aria-selected="false"
                      >
                        Users
                      </button>
                    </li>
                  </ul>
                </div>
              </div>
              <div class="card-footer d-flex justify-content-end py-2 px-2" id="roleActionButtons">
                <div class="btn-group w-30" role="group" aria-label="Role action buttons">
                  <button type="button" class="btn btn-outline-secondary" id="addRoleButton">
                    <i class="fa-solid fa-plus me-1"></i>
                    Add New
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    id="rolePreviousButton"
                    hidden
                  >
                    <i class="fa-solid fa-arrow-left me-1"></i>
                    Previous
                  </button>
                  <button type="button" class="btn btn-outline-secondary" id="roleNextButton">
                    Next
                    <i class="fa-solid fa-arrow-right ms-1"></i>
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-secondary"
                    id="saveRoleButton"
                    hidden
                  >
                    <i class="fa-solid fa-check me-1"></i>
                    Save
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-dark text-center py-2 mt-auto border-top">
      <div class="container">
        <div class="d-flex align-items-center justify-content-center mb-2">
          <img src="/summence_bw.png" alt="" width="32" height="32" />
        </div>
        <p class="text-white mb-0">Supply Chain Lite</p>
      </div>
    </footer>
    <script type="module" src="page_assets/user-management/js/main.js"></script>
  </body>
</html>
